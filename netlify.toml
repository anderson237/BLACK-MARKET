[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = ".netlify/functions-internal"

# ---------------------------------------------------------------------------
# REDIRECTS
# ---------------------------------------------------------------------------
# Nuxt SSR: serve static assets from dist directly (bypassing the function),
# then route everything else through the serverless function.
[[redirects]]
  from = "/_nuxt/*"
  to = "/_nuxt/:splat"
  status = 200
  force = true

# Static files that must be served straight from the CDN (no `force`, so an
# existing file is served instead of being redirected to the function):
#   - /og-image.png : default Open Graph image (Social previews / crawlers)
#   - /favicon.svg  : favicon linked in <head>
[[redirects]]
  from = "/og-image.png"
  to = "/og-image.png"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# SECURITY HEADERS — applied to every response
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https: ws:; font-src 'self' data: https:; media-src 'self' https: blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

# ---------------------------------------------------------------------------
# CACHING — long-lived for immutable assets; short for HTML/catalog
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/catalog.json"
  [headers.values]
    Cache-Control = "no-store"
