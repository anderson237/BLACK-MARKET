[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = ".netlify/functions-internal"

# ---------------------------------------------------------------------------
# REDIRECTS
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/catalog.json"
  to = "/.netlify/functions/server/catalog.json"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/server/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/server/robots.txt"
  status = 200

# Dynamic product pages: Nuxt SSR renders them live from the catalog.
[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

# Admin: Nuxt SSR.
[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/server/admin/:splat"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# SECURITY HEADERS — applied to every response
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https: ws:; font-src 'self' data: https:; media-src 'self' https: blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

# ---------------------------------------------------------------------------
# CACHING — long-lived for immutable assets; short for HTML/catalog
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/catalog.json"
  [headers.values]
    Cache-Control = "no-store"
