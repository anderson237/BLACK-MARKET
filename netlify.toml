[build]
  command = "npm run build"
  publish = ".output/public"

[functions]
  directory = ".netlify/functions-internal"

# ---------------------------------------------------------------------------
# REDIRECTS
# ---------------------------------------------------------------------------
# Nuxt SSR: route every request through the serverless function (serves both
# SSR HTML and static assets from .output/public).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# SECURITY HEADERS — applied to every response
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https: ws:; font-src 'self' data: https:; media-src 'self' https: blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

# ---------------------------------------------------------------------------
# CACHING — long-lived for immutable assets; short for HTML/catalog
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/catalog.json"
  [headers.values]
    Cache-Control = "no-store"
